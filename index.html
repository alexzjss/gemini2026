<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de Teste — Integração com Repositório</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --border: #334155;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
        --success: #16a34a;
        --border: #e2e8f0;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--success);
      background: rgba(34, 197, 94, 0.12);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
    }

    h1 {
      font-size: 1.5rem;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .meta {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      font-size: 0.875rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    code {
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      Teste de Integração
    </div>
    <h1>Página de Teste do Repositório</h1>
    <p>
      Esta página foi criada para validar se a sua integração está realizando commits corretamente no repositório <code>gemini2026</code>.
    </p>
    <div class="meta">
      <span>Arquivo: <code>index.html</code></span>
      <span id="timestamp"></span>
    </div>
  </main>

  <script>
    const el = document.getElementById("timestamp");
    el.textContent = "Carregado em: " + new Date().toLocaleString("pt-BR");
  </script>
</body>
</html>
