<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste Da Galera — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16150F}a:hover{color:#3045F0}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3045F0; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" aria-label="Sair do teste" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">Da Galera</span>
      <span style="font-size: 14px; font-weight: 700; min-width: 44px; text-align: right">7/10</span>
    </div>
    <div role="progressbar" aria-label="Progresso do teste" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
      <span style="height: 6px; border-radius: 3px; background: #CFF24A"></span>
      <span style="height: 6px; border-radius: 3px; background: #CFF24A"></span>
      <span style="height: 6px; border-radius: 3px; background: #CFF24A"></span>
      <span style="height: 6px; border-radius: 3px; background: #CFF24A"></span>
      <span style="height: 6px; border-radius: 3px; background: #CFF24A"></span>
      <span style="height: 6px; border-radius: 3px; background: #CFF24A"></span>
      <span style="height: 6px; border-radius: 3px; background: #FFFFFF"></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.25)"></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.25)"></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.25)"></span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 24px 20px 0; min-height: 0">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: #CFF24A; color: #16150F; padding: 5px 10px; border-radius: 6px">Sexta, 19h</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.08; letter-spacing: -0.01em">O grêmio quer fazer o interclasse e ninguém se mexeu. Você…</h1>
    </div>

    <div role="radiogroup" aria-label="Escolha uma opção" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{ options }}" as="opt" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{ opt.checked }}" onClick="{{ opt.pick }}" style="{{ opt.style }}">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #F4F1EA; border: 2px solid #16150F; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; color: #16150F">{{ opt.key }}</span>
          <span style="flex: 1; text-align: left; font-size: 16px; font-weight: 600; line-height: 1.3">{{ opt.label }}</span>
        </button>
      </sc-for>
    </div>
  </main>

  <footer style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 28px">
    <p style="margin: 0; font-size: 13px; line-height: 1.4; color: #DCE1FF; text-align: center">Não tem resposta certa e ninguém vai te dar nota aqui.</p>
    <sc-if value="{{ hasPick }}" hint-placeholder-val="{{ false }}">
      <a href="M-Resultado.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; background: #CFF24A; color: #16150F; border: 2px solid #16150F; border-radius: 999px; font-weight: 800; font-size: 17px; text-decoration: none; box-shadow: 4px 4px 0 #16150F">Próximo cenário
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </sc-if>
    <sc-if value="{{ noPick }}" hint-placeholder-val="{{ true }}">
      <span style="display: flex; align-items: center; justify-content: center; min-height: 56px; border: 2px dashed rgba(255,255,255,0.5); border-radius: 999px; font-weight: 700; font-size: 16px; color: #DCE1FF">Escolha uma opção</span>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }
  renderVals() {
    const base = 'display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 14px; border-radius: 18px; cursor: pointer; box-sizing: border-box; ';
    const idle = base + 'background: #FFFFFF; color: #16150F; border: 2px solid #16150F;';
    const on = base + 'background: #CFF24A; color: #16150F; border: 2px solid #16150F; box-shadow: 4px 4px 0 #16150F; transform: translate(-2px, -2px);';
    const raw = [
      { key: 'A', label: 'Monto a tabela de jogos e o chaveamento' },
      { key: 'B', label: 'Faço a arte e os posts pro Insta do grêmio' },
      { key: 'C', label: 'Vou atrás de patrocínio na lanchonete do bairro' },
      { key: 'D', label: 'Fico de juiz e resolvo as tretas' }
    ];
    const picked = this.state.picked;
    return {
      options: raw.map((o) => ({
        ...o,
        checked: picked === o.key ? 'true' : 'false',
        style: picked === o.key ? on : idle,
        pick: () => this.setState({ picked: o.key })
      })),
      hasPick: picked !== null,
      noPick: picked === null
    };
  }
}
</script>
</body>
</html>
