<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Swipe de carreiras — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#16150F}a:hover{color:#3045F0}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; color: #16150F; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.01em">Carreiras</h1>
    <span style="display: inline-flex; align-items: center; gap: 6px; border: 2px solid #16150F; background: #FFFFFF; font-weight: 700; font-size: 14px; border-radius: 999px; padding: 8px 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      {{ savedLabel }}
    </span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; padding: 8px 20px 0; min-height: 0">
    <div style="position: relative; flex: 1; min-height: 0">
      <div aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 14px; bottom: -10px; background: #FFFFFF; border: 2px solid #16150F; border-radius: 24px; transform: rotate(2.5deg)"></div>
      <article aria-label="{{ card.title }}" style="position: absolute; inset: 0; background: #FFFFFF; border: 2px solid #16150F; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 4px 4px 0 #16150F">
        <div style="{{ card.headStyle }}">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{ card.position }}</span>
            <span style="font-size: 12px; font-weight: 700; border: 2px solid currentColor; border-radius: 999px; padding: 3px 8px">combina: {{ card.why }}</span>
          </div>
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.02; letter-spacing: -0.01em">{{ card.title }}</h2>
        </div>
        <div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #59564C">Raio-x de um dia</span>
            <sc-for list="{{ card.day }}" as="d" hint-placeholder-count="3">
              <div style="display: flex; gap: 10px; align-items: baseline">
                <span style="flex: none; width: 40px; font-weight: 800; font-size: 14px; font-family: 'Bricolage Grotesque', sans-serif">{{ d.t }}</span>
                <span style="font-size: 14px; line-height: 1.35">{{ d.what }}</span>
              </div>
            </sc-for>
          </div>
          <div style="background: #F4F1EA; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
            <span style="align-self: flex-start; font-size: 12px; font-weight: 700; background: #16150F; color: #CFF24A; padding: 4px 8px; border-radius: 6px">{{ card.code }}</span>
            <span style="font-size: 14px; line-height: 1.35"><strong>Onde a escola aparece:</strong> {{ card.school }}</span>
          </div>
          <a href="M-Live.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border: 2px solid #16150F; border-radius: 14px; text-decoration: none; color: #16150F; font-weight: 700; font-size: 14px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            Perguntar por voz pra um mentor simulado
          </a>
        </div>
      </article>
    </div>
  </main>

  <div style="display: flex; justify-content: center; align-items: center; gap: 18px; padding: 24px 20px 30px">
    <button type="button" onClick="{{ pass }}" aria-label="Passar" style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; border: 2px solid #16150F; color: #16150F; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="button" onClick="{{ save }}" aria-label="Salvar pra depois" style="width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; border: 2px solid #16150F; color: #16150F; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    </button>
    <button type="button" onClick="{{ match }}" style="height: 64px; padding: 0 22px; border-radius: 999px; background: #CFF24A; border: 2px solid #16150F; color: #16150F; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 800; font-size: 16px; box-shadow: 4px 4px 0 #16150F">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/></svg>
      Quero conhecer
    </button>
  </div>

  <nav aria-label="Navegação principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 2px solid #16150F; padding: 8px 8px 20px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; text-decoration: none; color: #59564C; font-size: 12px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>Início</a>
    <a href="M-Carreiras.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; text-decoration: none; color: #16150F; font-size: 12px; font-weight: 700">
      <span style="background: #CFF24A; border: 2px solid #16150F; border-radius: 999px; padding: 2px 14px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M3 7v10M21 7v10"/></svg></span>Carreiras</a>
    <a href="M-Missoes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; text-decoration: none; color: #59564C; font-size: 12px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>Missões</a>
    <a href="M-Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; text-decoration: none; color: #59564C; font-size: 12px; font-weight: 600">
      <span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0, saved: 2 };
  }
  renderVals() {
    const head = 'padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 150px; box-sizing: border-box; border-bottom: 2px solid #16150F; ';
    const cards = [
      {
        title: 'Analista de dados esportivos',
        why: 'futebol + números',
        headStyle: head + 'background: #3045F0; color: #FFFFFF;',
        day: [
          { t: '9h', what: 'Puxa os números do jogo de ontem' },
          { t: '14h', what: 'Monta o relatório pro técnico' },
          { t: '17h', what: 'Mostra quem cansa mais no 2º tempo' }
        ],
        code: 'EM13MAT316',
        school: 'média e desvio padrão pra comparar jogadores.'
      },
      {
        title: 'Gestor(a) de equipe de e-sports',
        why: 'games + negócios',
        headStyle: head + 'background: #CFF24A; color: #16150F;',
        day: [
          { t: '10h', what: 'Fecha a agenda de treinos da semana' },
          { t: '15h', what: 'Negocia com um patrocinador' },
          { t: '20h', what: 'Revê replay com o time' }
        ],
        code: 'EM13LGG303',
        school: 'argumentar e defender uma proposta na negociação.'
      },
      {
        title: 'Técnico(a) em logística',
        why: 'organizar + resolver',
        headStyle: head + 'background: #16150F; color: #F4F1EA;',
        day: [
          { t: '7h', what: 'Planeja a rota das entregas' },
          { t: '11h', what: 'Confere o estoque' },
          { t: '16h', what: 'Resolve um atraso de caminhão' }
        ],
        code: 'EM13MAT310',
        school: 'contagem pra comparar combinações de rota.'
      }
    ];
    const i = this.state.idx % cards.length;
    const next = (extra) => () => this.setState({ idx: this.state.idx + 1, ...extra });
    return {
      card: { ...cards[i], position: (i + 1) + ' de ' + cards.length + ' hoje' },
      savedLabel: this.state.saved + ' salvas',
      pass: next({}),
      save: next({ saved: this.state.saved + 1 }),
      match: next({ saved: this.state.saved + 1 })
    };
  }
}
</script>
</body>
</html>
